name: rizma
description: "Rizma - offline-first learning app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  drift: '>=2.31.0 <2.32.0'
  drift_flutter: '>=0.2.0 <0.3.0'
  path_provider: ^2.1.6
  crypto: ^3.0.7
  uuid: ^4.6.0
  share_plus: ^13.3.1
  flutter_tts: ^4.2.5
  supabase: ^2.16.5
  http: ^1.6.0
  cryptography: ^2.9.0
  connectivity_plus: ^7.0.0
  video_player: ^2.11.1
  pdfx: ^2.11.0
  file_picker: ^13.3.0
  nearby_connections: ^4.3.0
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  video_player_platform_interface: ^6.9.0
  drift_dev: '>=2.31.0 <2.32.0'
  build_runner: ^2.4.13

flutter:

  uses-material-design: true

  assets:
    - assets/images/brand/
    - assets/icons/
    - assets/icons/ui/
    - assets/content/
    - assets/content/lessons/
    - assets/illustrations/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800

